[project]
name = "tree-reinforcement-learning"
version = "0.1.0"
description = "Independent RL environment for precise insertion Cases 4-7"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3", "tensorboard>=2.14"]
mujoco = ["mujoco>=3.2", "pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
tree-rl-validate = "tree_reinforcement_learning.cli:validate"
tree-rl-train = "tree_reinforcement_learning.cli:train"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
